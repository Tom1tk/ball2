name: Godot CI

on:
  push:
    branches: [godot-rewrite]
  pull_request:
    branches: [godot-rewrite]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      GODOT_SILENCE_ROOT_WARNING: 1

    steps:
      - name: Check out (with Git LFS assets)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify LFS assets are real files
        run: |
          file assets/textures/BallTex3.png | grep -q "PNG image data"
          file assets/audio/hit_heavy.wav | grep -q "WAVE audio"
          test -s assets/sprites/hamster.svg

      - name: Install Godot .NET
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot
          GODOT_BIN=$(find godot -maxdepth 2 -type f -name 'Godot_v*mono_linux.x86_64' | head -n1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        run: $GODOT_BIN --headless --path . --editor --quit

      - name: Build
        run: dotnet build Ball2Godot.csproj --nologo

      - name: Core tests
        run: dotnet test tests/Ball2.Core.Tests/Ball2.Core.Tests.csproj --nologo

      - name: Main scene smoke test
        run: $GODOT_BIN --headless --path . res://scenes/main.tscn --quit-after 120

      - name: Gameplay integration tests
        run: $GODOT_BIN --headless --path . res://tests/GameplayTests.tscn
